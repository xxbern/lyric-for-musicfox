name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb1-dev libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --all-targets

      - name: Cargo Test
        run: cargo test --all-targets
        # 不要加 --nocapture：GitHub Actions runner 通过匿名 pipe 消费子进程 stderr，
        # MSVC/Windows 上 stderr 写入 4KB 以上会阻塞写端，造成测试进程 deadlock。
        # cargo test 在 panic 时仍会输出 backtrace，不需要 --nocapture。
        timeout-minutes: 30

      - name: Cargo Check (Windows with Skia)
        if: runner.os == 'Windows'
        run: cargo check --features skia
