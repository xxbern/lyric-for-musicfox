name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb1-dev libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --all-targets

      - name: Cargo Test (lib + bins)
        run: cargo test --lib --bins
        timeout-minutes: 10

      - name: Cargo Test (integration tests)
        # 串行跑 integration test：其中 pipe / instance / logger 等会触碰
        # 进程级资源（命名管道、全局 mutex、后台日志线程）。
        run: cargo test --tests -- --test-threads=1
        timeout-minutes: 20

      - name: Cargo Check (Windows with Skia)
        if: runner.os == 'Windows'
        run: cargo check --features skia
